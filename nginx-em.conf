# nginx 設定 - EM Express 用リバースプロキシ
# Oracle XE の tcps (5500) を HTTP (5501) 経由で公開し、
# Oracle が誤って返す text/plain を .js のみ application/javascript に修正する

events {
    worker_connections 64;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /tmp/nginx-logs/em-access.log;
    error_log  /tmp/nginx-logs/em-error.log;

    server {
        listen 5501;
        server_name _;

        # .js ファイル: Oracle が text/plain で返すため application/javascript に上書き
        location ~* \.js$ {
            proxy_pass            https://127.0.0.1:5500;
            proxy_ssl_verify      off;
            proxy_http_version    1.1;
            proxy_set_header      Host $host;
            proxy_set_header      X-Real-IP $remote_addr;
            proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_hide_header     Content-Type;
            add_header            Content-Type "application/javascript; charset=UTF-8" always;
        }

        # その他すべてのリソースはそのままパス
        location / {
            proxy_pass         https://127.0.0.1:5500;
            proxy_ssl_verify   off;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
